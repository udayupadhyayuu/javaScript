<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM | Chai aur Code</title>
  </head>
  <body style="background-color: #212121; color: white">
    <ul class="language">
      <li>JavaScript</li>
    </ul>
  </body>
  <script>
    function addLanguage(LanName) {
      const li = document.createElement("li");
      li.innerHTML = `${LanName}`;
      document.querySelector(".language").appendChild(li);
    }
    addLanguage("python");
    addLanguage("Java");

    function addOptLang(LanName) {
      const li = document.createElement("li");
      li.appendChild(document.createTextNode(LanName));
      document.querySelector(".language").appendChild(li);
    }
    addOptLang("goLang");

    //Edit
    const secondLang = document.querySelector("li:nth-child(2)");
    console.log(secondLang);
    //secondLang.innerHTML = "typeScript";

    const newLi = document.createElement("li");
    newLi.textContent = "typeScript";
    secondLang.replaceWith(newLi);

    //Edit First
    const firstEleent = document.querySelector("li:nth-child(1)");
    const firstLi = document.createElement("li");
    firstLi.innerHTML = "Rust";

    firstEleent.replaceWith(firstLi);
  </script>
</html>
